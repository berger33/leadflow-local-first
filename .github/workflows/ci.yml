name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow JSON
        run: python -m json.tool n8n-agent-workflow.json >/dev/null

      - name: Validate agentic architecture contract
        shell: python
        run: |
          import json
          from pathlib import Path

          data = json.loads(Path('n8n-agent-workflow.json').read_text(encoding='utf-8'))
          nodes = {node['name']: node for node in data['nodes']}
          required = {
              'Agente Orquestrador', 'Agente QA Validador', 'ler_email',
              'apagar_email', 'resumir_email', 'enviar_whatsapp', 'criar_evento',
              'Wait · Aprovação apagar_email', 'Wait · Aprovação enviar_whatsapp',
              'Audit · Input', 'Audit · Decisão do Agente', 'Audit · Output',
          }
          missing = sorted(required - nodes.keys())
          assert not missing, f'Nós obrigatórios ausentes: {missing}'
          assert nodes['Agente Orquestrador']['type'] == '@n8n/n8n-nodes-langchain.agent'
          assert nodes['Agente QA Validador']['type'] == '@n8n/n8n-nodes-langchain.agent'
          assert nodes['Wait · Aprovação apagar_email']['type'] == 'n8n-nodes-base.wait'
          assert nodes['Wait · Aprovação enviar_whatsapp']['type'] == 'n8n-nodes-base.wait'
          assert nodes['apagar_email']['type'] == '@n8n/n8n-nodes-langchain.toolWorkflow'
          assert nodes['enviar_whatsapp']['type'] == '@n8n/n8n-nodes-langchain.toolWorkflow'
          print(f'Workflow válido: {len(data["nodes"])} nós, dual-agent, 5 tools e 2 gates HITL.')

      - name: Validate visual installer HTML contract
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path('setup/index.html').read_text(encoding='utf-8')
          required_ids = {
              'ownerFirstName','ownerLastName','ownerEmail','ownerPassword',
              'approvalEmail','model','validatorModel','timezone','googleClientId',
              'googleClientSecret','googleCallback','installBtn','wahaUser','wahaPass',
              'progress','log','ownerLoginSummary'
          }
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set()
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if 'id' in d: self.ids.add(d['id'])
          p=P(); p.feed(html)
          missing=required_ids-p.ids
          assert not missing, f'IDs obrigatórios da UI ausentes: {sorted(missing)}'
          assert '/api/config' in html and '/api/install' in html and '/api/status' in html
          assert 'http://localhost:5678/rest/oauth2-credential/callback' in html
          assert 'Instalar e configurar automaticamente' in html
          print('Visual installer HTML contract: OK')

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_STRONG_DATABASE_PASSWORD/test-database-password/' .env
          sed -i 's/CHANGE_ME_64_CHARS_OR_MORE/test-encryption-key-012345678901234567890123456789/' .env
          sed -i 's/CHANGE_ME_32_CHARS_OR_MORE/test-waha-api-key-01234567890123456789/' .env
          sed -i 's/CHANGE_ME_STRONG_PASSWORD/test-dashboard-password/' .env
          sed -i 's/^APPROVAL_EMAIL=.*/APPROVAL_EMAIL=ci@example.com/' .env

      - name: Validate Docker Compose syntax
        run: docker compose config --quiet

      - name: Validate Windows PowerShell scripts syntax
        shell: pwsh
        run: |
          foreach ($path in @('scripts/bootstrap.ps1','scripts/setup-wizard.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            Write-Host "$path syntax: OK"
          }

      - name: Validate guided setup contract
        run: |
          grep -q "ValidateSet('Full','Prepare','Finalize','Start')" scripts/bootstrap.ps1
          grep -q 'showSetupOnFirstLoad' scripts/bootstrap.ps1
          grep -q "docker compose up -d postgres ollama" scripts/bootstrap.ps1
          grep -q "docker compose up -d n8n waha" scripts/bootstrap.ps1
          grep -q 'ollama pull' scripts/bootstrap.ps1
          grep -q 'ollama show' scripts/bootstrap.ps1
          grep -q 'import:credentials' scripts/bootstrap.ps1
          grep -q 'import:workflow' scripts/bootstrap.ps1
          grep -q 'Ollama Local - Sistema Agentico' scripts/bootstrap.ps1
          grep -q 'Gmail - Sistema Agentico' scripts/bootstrap.ps1
          grep -q 'Google Calendar - Sistema Agentico' scripts/bootstrap.ps1
          grep -q '/rest/owner/setup' scripts/setup-wizard.ps1
          grep -q '/api/config' scripts/setup-wizard.ps1
          grep -q '/api/install' scripts/setup-wizard.ps1
          grep -q 'GOOGLE_CLIENT_ID' .env.example
          grep -q 'GOOGLE_CLIENT_SECRET' .env.example
          grep -q 'http://localhost:5678/rest/oauth2-credential/callback' .env.example

      - name: Security regression checks
        run: |
          ! grep -R -nE '(AIza[0-9A-Za-z_-]{30,}|ghp_[0-9A-Za-z]{20,}|-----BEGIN PRIVATE KEY-----)' . --exclude-dir=.git
          grep -q '127.0.0.1:5678:5678' docker-compose.yml
          grep -q '127.0.0.1:3000:3000' docker-compose.yml
          grep -q '127.0.0.1:11434:11434' docker-compose.yml
          grep -q 'N8N_EDITOR_BASE_URL: http://localhost:5678/' docker-compose.yml
          grep -q './setup:/files/setup:ro' docker-compose.yml
          grep -q 'setup/\*.runtime.json' .gitignore
          ! grep -q 'ollama-init:' docker-compose.yml

  docker-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_STRONG_DATABASE_PASSWORD/test-database-password/' .env
          sed -i 's/CHANGE_ME_64_CHARS_OR_MORE/test-encryption-key-012345678901234567890123456789/' .env
          sed -i 's/CHANGE_ME_32_CHARS_OR_MORE/test-waha-api-key-01234567890123456789/' .env
          sed -i 's/CHANGE_ME_STRONG_PASSWORD/test-dashboard-password/' .env
          sed -i 's/^APPROVAL_EMAIL=.*/APPROVAL_EMAIL=ci@example.com/' .env

      - name: Start full infrastructure
        run: docker compose up -d postgres ollama n8n waha

      - name: Wait for Ollama
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo 'Ollama API: OK'; exit 0
            fi
            sleep 2
          done
          docker compose logs ollama
          exit 1

      - name: Verify real Ollama pull path
        run: |
          docker compose exec -T ollama ollama pull qwen3:0.6b
          docker compose exec -T ollama ollama show qwen3:0.6b >/dev/null
          docker compose exec -T ollama ollama list

      - name: Wait for n8n
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5678/healthz >/dev/null; then
              echo 'n8n: OK'; exit 0
            fi
            sleep 2
          done
          docker compose logs n8n
          exit 1

      - name: Validate n8n first-run state
        run: |
          curl -fsS http://127.0.0.1:5678/rest/settings > /tmp/n8n-settings-before.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/n8n-settings-before.json', encoding='utf-8'))
          assert data['data']['userManagement']['showSetupOnFirstLoad'] is True
          print('n8n starts in owner-setup state: OK')
          PY

      - name: Create n8n owner through official local endpoint
        run: |
          curl -fsS -X POST http://127.0.0.1:5678/rest/owner/setup \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","firstName":"CI","lastName":"Setup","password":"CiPassword1"}' >/tmp/owner.json
          curl -fsS http://127.0.0.1:5678/rest/settings > /tmp/n8n-settings-after.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/n8n-settings-after.json', encoding='utf-8'))
          assert data['data']['userManagement']['showSetupOnFirstLoad'] is False
          print('n8n owner setup endpoint: OK')
          PY

      - name: Validate bootstrap finalization end to end
        shell: pwsh
        run: |
          ./scripts/bootstrap.ps1 -Mode Finalize -NoOpen -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify imported workflow and cleanup
        run: |
          docker compose exec -T n8n n8n list:workflow | tee /tmp/workflows.txt
          grep -q 'Sistema Agêntico n8n WhatsApp+Email' /tmp/workflows.txt
          test -f .setup-complete
          test ! -f setup/credentials.runtime.json
          test ! -f setup/workflow.runtime.json

      - name: Wait for WAHA
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              echo 'WAHA: OK'; exit 0
            fi
            sleep 2
          done
          docker compose logs waha
          exit 1

      - name: Show final service state
        run: docker compose ps

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
