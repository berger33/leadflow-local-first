name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow JSON
        run: python -m json.tool n8n-agent-workflow.json >/dev/null

      - name: Validate agentic architecture contract
        shell: python
        run: |
          import json
          from pathlib import Path

          data = json.loads(Path('n8n-agent-workflow.json').read_text(encoding='utf-8'))
          nodes = {node['name']: node for node in data['nodes']}

          required = {
              'Agente Orquestrador',
              'Agente QA Validador',
              'ler_email',
              'apagar_email',
              'resumir_email',
              'enviar_whatsapp',
              'criar_evento',
              'Wait · Aprovação apagar_email',
              'Wait · Aprovação enviar_whatsapp',
              'Audit · Input',
              'Audit · Decisão do Agente',
              'Audit · Output',
          }
          missing = sorted(required - nodes.keys())
          assert not missing, f'Nós obrigatórios ausentes: {missing}'

          assert nodes['Agente Orquestrador']['type'] == '@n8n/n8n-nodes-langchain.agent'
          assert nodes['Agente QA Validador']['type'] == '@n8n/n8n-nodes-langchain.agent'
          assert nodes['Wait · Aprovação apagar_email']['type'] == 'n8n-nodes-base.wait'
          assert nodes['Wait · Aprovação enviar_whatsapp']['type'] == 'n8n-nodes-base.wait'
          assert nodes['apagar_email']['type'] == '@n8n/n8n-nodes-langchain.toolWorkflow'
          assert nodes['enviar_whatsapp']['type'] == '@n8n/n8n-nodes-langchain.toolWorkflow'

          text = Path('n8n-agent-workflow.json').read_text(encoding='utf-8')
          for signature in ['ler_email', 'apagar_email', 'resumir_email', 'enviar_whatsapp', 'criar_evento']:
              assert signature in text

          print(f'Workflow válido: {len(data["nodes"])} nós, dual-agent, 5 tools e 2 gates HITL.')

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_STRONG_DATABASE_PASSWORD/test-database-password/' .env
          sed -i 's/CHANGE_ME_64_CHARS_OR_MORE/test-encryption-key-012345678901234567890123456789/' .env
          sed -i 's/CHANGE_ME_32_CHARS_OR_MORE/test-waha-api-key-01234567890123456789/' .env
          sed -i 's/CHANGE_ME_STRONG_PASSWORD/test-dashboard-password/' .env
          sed -i 's/^APPROVAL_EMAIL=.*/APPROVAL_EMAIL=ci@example.com/' .env

      - name: Validate Docker Compose syntax
        run: docker compose config --quiet

      - name: Validate Windows bootstrap PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/bootstrap.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'bootstrap.ps1 syntax: OK'

      - name: Validate first-run bootstrap contract
        run: |
          grep -q 'showSetupOnFirstLoad' scripts/bootstrap.ps1
          grep -q "docker compose up -d postgres ollama" scripts/bootstrap.ps1
          grep -q "docker compose up -d n8n waha" scripts/bootstrap.ps1
          grep -q 'ollama pull' scripts/bootstrap.ps1
          grep -q 'ollama show' scripts/bootstrap.ps1
          grep -q 'import:workflow' scripts/bootstrap.ps1

      - name: Security regression checks
        run: |
          ! grep -R -nE '(AIza[0-9A-Za-z_-]{30,}|ghp_[0-9A-Za-z]{20,}|-----BEGIN PRIVATE KEY-----)' . --exclude-dir=.git
          grep -q '127.0.0.1:5678:5678' docker-compose.yml
          grep -q '127.0.0.1:3000:3000' docker-compose.yml
          grep -q '127.0.0.1:11434:11434' docker-compose.yml
          ! grep -q 'ollama-init:' docker-compose.yml

  docker-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_STRONG_DATABASE_PASSWORD/test-database-password/' .env
          sed -i 's/CHANGE_ME_64_CHARS_OR_MORE/test-encryption-key-012345678901234567890123456789/' .env
          sed -i 's/CHANGE_ME_32_CHARS_OR_MORE/test-waha-api-key-01234567890123456789/' .env
          sed -i 's/CHANGE_ME_STRONG_PASSWORD/test-dashboard-password/' .env
          sed -i 's/^APPROVAL_EMAIL=.*/APPROVAL_EMAIL=ci@example.com/' .env

      - name: Start full infrastructure
        run: docker compose up -d postgres ollama n8n waha

      - name: Wait for Ollama
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo 'Ollama API: OK'
              exit 0
            fi
            sleep 2
          done
          docker compose logs ollama
          exit 1

      - name: Verify real Ollama pull path
        run: |
          docker compose exec -T ollama ollama pull qwen3:0.6b
          docker compose exec -T ollama ollama show qwen3:0.6b >/dev/null
          docker compose exec -T ollama ollama list

      - name: Wait for n8n
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5678/healthz >/dev/null; then
              echo 'n8n: OK'
              exit 0
            fi
            sleep 2
          done
          docker compose logs n8n
          exit 1

      - name: Validate n8n first-run settings endpoint
        run: |
          curl -fsS http://127.0.0.1:5678/rest/settings > /tmp/n8n-settings.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/n8n-settings.json', encoding='utf-8'))
          value = data['data']['userManagement']['showSetupOnFirstLoad']
          assert isinstance(value, bool), value
          print('n8n showSetupOnFirstLoad contract: OK ->', value)
          PY

      - name: Wait for WAHA
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              echo 'WAHA: OK'
              exit 0
            fi
            sleep 2
          done
          docker compose logs waha
          exit 1

      - name: Show final service state
        run: docker compose ps

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
