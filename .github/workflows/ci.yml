name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Validate workflow JSON
        run: |
          python -m json.tool n8n/workflows/daily-technology-news.json >/dev/null
          python -m json.tool n8n/workflows/research-on-demand.json >/dev/null
          python -m json.tool n8n/workflows/daily-whatsapp-summary.json >/dev/null
      - name: Validate Docker Compose syntax
        run: |
          cp .env.example .env
          docker compose config --quiet
